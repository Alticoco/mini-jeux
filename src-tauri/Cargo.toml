[package]
name = "mini-jeux"
version = "1.0.0"
description = "Mini-Jeux : collection de jeux simples, 100 % hors ligne"
edition = "2021"

[lib]
name = "mini_jeux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
